name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: lint + tests + build
    # Pin the image so a ubuntu-latest migration can't change the build OS
    # underneath the pipeline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (includes the lib purity rule)
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:run

      - name: Build
        run: npm run build
