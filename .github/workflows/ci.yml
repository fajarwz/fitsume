name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (includes the lib purity rule)
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:run

      - name: Build
        run: npm run build
